<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✓ My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task..." 
                class="todo-input"
                autocomplete="off"
            >
            <button id="addBtn" class="add-btn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <span><strong id="totalCount">0</strong> Total</span>
            <span><strong id="activeCount">0</strong> Active</span>
            <span><strong id="completedCount">0</strong> Completed</span>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div id="emptyState" class="empty-state hidden">
            <p>📝 No tasks yet. Add one to get started!</p>
        </div>

        <div class="action-buttons">
            <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
            <button id="clearAllBtn" class="clear-all-btn">Clear All</button>
        </div>

        <footer>
            <p>Your tasks are automatically saved to your device</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
