<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multi Timezone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🕐 Digital Clock</h1>
            <p class="subtitle">View time across the world</p>
        </header>

        <div class="main-clock-section">
            <div class="local-clock">
                <div class="clock-display">
                    <div id="mainTime" class="main-time">00:00:00</div>
                    <div id="mainDate" class="main-date">Monday, January 1, 2024</div>
                    <div id="mainTimezone" class="main-timezone">Local Time</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="search-section">
                <input 
                    type="text" 
                    id="timezoneInput" 
                    placeholder="Search timezone (e.g., New York, Tokyo, London)..." 
                    class="timezone-input"
                >
                <button id="addBtn" class="add-btn">+ Add Timezone</button>
            </div>

            <div class="format-toggle">
                <label>
                    <input type="checkbox" id="use24Hour" checked>
                    <span>24-Hour Format</span>
                </label>
            </div>
        </div>

        <div id="suggestionsContainer" class="suggestions hidden"></div>

        <div class="timezones-grid" id="timezonesGrid">
            <!-- Timezone clocks will be added here -->
        </div>

        <div id="emptyState" class="empty-state">
            <p>🌍 Add timezones to see multiple clocks</p>
        </div>

        <footer>
            <p>All times are synchronized and update every second</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
